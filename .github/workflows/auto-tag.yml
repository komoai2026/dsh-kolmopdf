name: Auto Tag on Version Bump

# Tag a new release automatically when the package.json version changes on
# main: create the v<version> tag on the bump commit and call the Release &
# Publish workflow (npm publish + GitHub Release).
#
# The tag is pushed with the default GITHUB_TOKEN, which does not emit a
# `push` event back into the repository, so the release is triggered through
# the workflow_call path instead — no PAT is required. The publish job still
# runs `pnpm check` (typecheck + tests + build) and fails loudly on a broken
# bump, so CI results on main do not need to gate the tag.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the version with the latest version tag
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          LATEST="$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -n 1 || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST:-<none>}" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Print the decision
        run: |
          echo "package.json version: ${{ steps.version.outputs.version }}"
          echo "latest version tag: ${{ steps.version.outputs.latest }}"
          echo "changed: ${{ steps.version.outputs.changed }}"
          echo "tag to create: ${{ steps.version.outputs.tag }}"

      - name: Create and push the version tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG_TO_CREATE: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG_TO_CREATE}" > /dev/null; then
            echo "tag ${TAG_TO_CREATE} already exists; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_TO_CREATE}" -m "Release ${TAG_TO_CREATE}"
          git push origin "${TAG_TO_CREATE}"

  release:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.detect.outputs.tag }}
