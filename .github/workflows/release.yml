name: Release & Publish

# One workflow for the whole release pipeline:
#
#   * Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
#     → releases exactly that tag.
#   * Change `version` in `package.json` and push to `main`
#     → the workflow detects the bump, creates and pushes the v<version> tag
#     on the bump commit, and releases it in the same run (the internal-token
#     tag push does not emit a `push` event, so nothing re-triggers).
#
# The tag must match the package.json version exactly. Prerelease versions
# (containing "-") publish under the `next` dist-tag; stable versions under
# `latest`.
#
# Publishing uses pnpm's native publish with npm trusted publishing (OIDC):
# npm exchanges the GitHub Actions ID token for a short-lived publish token
# bound to this workflow file, so no NPM_TOKEN secret is needed. Provenance
# attestations are generated automatically; `--provenance` makes a missing or
# misconfigured trusted publisher fail loudly instead of publishing silently.
# `prepublishOnly` (pnpm check: typecheck + tests + build) runs before the
# publish, and the built `lib/` is packed from the CI working tree, so the
# tarball always ships fresh artifacts even when the tag's committed lib is
# stale.
#
# One-time npmjs setup: open the package page on npmjs.com → Settings →
# Trusted publishing and authorize ".github/workflows/release.yml" for this
# repository (GitHub Actions). Creating the publisher can also be done with
# `npm trust` from a token-authenticated terminal.

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write # version tag + GitHub Release creation
  id-token: write # npm trusted publishing (OIDC) + provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            VERSION="$(node -p "require('./package.json').version")"
            LATEST="$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -n 1 || true)"
            if [ "v$VERSION" = "$LATEST" ]; then
              echo "package.json version $VERSION is already released (latest tag ${LATEST:-<none>}); nothing to do"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="v$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches package.json
        if: steps.resolve.outputs.released == 'true'
        env:
          TAG_TO_RELEASE: ${{ steps.resolve.outputs.tag }}
        run: |
          TAG="${TAG_TO_RELEASE#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG_TO_RELEASE does not match package.json version $VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        if: steps.resolve.outputs.released == 'true'

      - uses: actions/setup-node@v4
        if: steps.resolve.outputs.released == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Compute the npm dist-tag
        if: steps.resolve.outputs.released == 'true'
        id: dist-tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.resolve.outputs.released == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish to npm (trusted publishing via OIDC)
        if: steps.resolve.outputs.released == 'true'
        # pnpm publish runs the prepublishOnly lifecycle (`pnpm check`) and
        # authenticates through the GitHub Actions OIDC token — no NPM_TOKEN.
        run: |
          pnpm publish --no-git-checks --access public --tag "${{ steps.dist-tag.outputs.tag }}" --provenance

      - name: Create the GitHub Release
        if: steps.resolve.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_TO_RELEASE: ${{ steps.resolve.outputs.tag }}
        run: |
          gh release create "$TAG_TO_RELEASE" --generate-notes --verify-tag
